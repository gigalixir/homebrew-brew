name: brew install
on:
  pull_request:
  # Also dispatched by update-formula.yml on its bot branch: a pull_request run
  # for a PR that workflow opens with its GITHUB_TOKEN waits for manual approval.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run brew update
        run: brew update
      - name: Tap the checked-out formula
        run: brew tap gigalixir/brew "$GITHUB_WORKSPACE"
      - name: Run brew install
        run: brew install gigalixir/brew/gigalixir
      - name: Check gigalixir
        run: |
          gigalixir version
          gigalixir help
