name: brew install
on:
  push:
    branches: main
  pull_request: []
jobs:
  test-bot:
    runs-on: macos-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2
      - name: Run brew update
        run: brew update
      - name: Run brew install
        run: brew tap gigalixir/brew && brew install gigalixir
      - name: Check gigalixir
        run: |
          gigalixir version
          gigalixir help
